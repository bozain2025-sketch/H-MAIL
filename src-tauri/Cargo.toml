[package]
name = "mailhub-core"
version = "0.1.0"
description = "MailHub - High-density multi-account macOS email client"
edition = "2021"
default-run = "mailhub-core"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-fts5", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Provider network stack (compiled on target)
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false, optional = true }

# Target specific (macOS Keychain)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[features]
default = []
providers = ["reqwest"]
